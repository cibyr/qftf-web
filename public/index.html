<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=0.9">

  <title>QFT</title>

  <link rel="stylesheet" href="./css/normalize.css">
  <link rel="stylesheet" href="./css/skeleton.css">
  <link rel="stylesheet" href="./css/main.css">

  <script type="module" src="./js/main.js"></script>
</head>

<body>
<div class="container">
  <h4>
    QR Code File Transfer
  </h4>

  <h5>Scan the QR code from the sender and the receiver on this page, then hit the go button</h5>

  <button id="videoBtn">Start Camera</button>

  <div class="viewport">
    <canvas id="canvas"></canvas>
    <img id="img" crossorigin="anonymous">
    <video id="video" muted autoplay playsinline></video>
  </div>

  <form id="qft">
      <div class="fields">
          <div>
          <label for="txcode">Sender code:</label>
          <input id="txcode" name="txcode" placeholder="txcode" />
          </div>
          <div>
          <label for="rxcode">Receiver code:</label>
          <input id="rxcode" name="rxcode" placeholder="rxcode" />
          </div>
      </div>
      <div>
          <button id="goBtn" type="submit">GO!</button>
      </div>
  </form>

  <main></main>

</div>
</body>
</html>
